# Casos de eval do agente (spec 005).
# Perfis por "domínio:Título" (resolvido no catálogo ao carregar) ou por item_id.
# `count` aceita um número ou [mínimo, máximo].

# ---------------------------------------------------------------- personalização
- id: pers-movie-scifi
  category: personalizacao
  message: "Me indica 3 filmes pra ver hoje à noite."
  profile:
    liked: ["movie:The Matrix", "movie:Blade Runner", "movie:Inception"]
  expect:
    domains: [movie]
    count: 3
    must_call: [recommend_for_user, find_similar, search_catalog]
    relevant_tags: [science-fiction, thriller, cyberpunk, dystopia]

- id: pers-book-romance
  category: personalizacao
  message: "Quero 4 livros novos pra ler."
  profile:
    liked: ["book:Me Before You", "book:The Fault in Our Stars", "book:Bridget Jones's Diary"]
  expect:
    domains: [book]
    count: 4
    must_call: [recommend_for_user, find_similar, search_catalog]
    relevant_tags: [romance, contemporary, chick-lit, young-adult]

- id: pers-music-chill
