# ---------------------------------------------------------------- restrições
- id: restr-years-movie
  category: restricoes
  message: "3 filmes de ficção científica lançados depois de 2010."
  profile:
    liked: ["movie:The Matrix", "movie:Alien"]
  expect:
    domains: [movie]
    count: 3
    year_min: 2010
    must_call: [recommend_for_user, find_similar, search_catalog]
    relevant_tags: [science-fiction]

- id: restr-no-horror-series
  category: restricoes
  message: "Quero 3 séries de mistério, mas nada de terror."
  profile:
    liked: ["series:Stranger Things", "series:Dark"]
  expect:
    domains: [series]
    count: 3
    exclude_tags: [horror]
    must_call: [recommend_for_user, find_similar, search_catalog]
    relevant_tags: [mystery]

- id: restr-old-scifi-books
  category: restricoes
  message: "Me indica 4 livros de ficção científica escritos antes de 1980."
  profile:
    liked: ["book:Neuromancer", "book:Ender's Game"]
  expect:
    domains: [book]
    count: 4
    year_max: 1979
    must_call: [recommend_for_user, find_similar, search_catalog]
    relevant_tags: [science-fiction]

- id: restr-exact-count-music
  category: restricoes
  message: "Só 2 bandas, por favor, nada mais."
  profile:
    liked: ["music:Metallica", "music:Iron Maiden"]
  expect:
    domains: [music]
    count: 2
    must_call: [recommend_for_user, find_similar, search_catalog]
    relevant_tags: [metal, hard-rock, thrash-metal, heavy-metal]

- id: restr-kids-animation
  category: restricoes
  message: "Filme de animação pra ver com criança, sem terror, lançado depois de 2000. Quero 3 opções."
  profile:
    liked: ["movie:Spirited Away", "movie:Toy Story"]
  expect:
    domains: [movie]
    count: 3
    year_min: 2000
    exclude_tags: [horror]
    must_call: [recommend_for_user, find_similar, search_catalog]
    relevant_tags: [animation, kids]

