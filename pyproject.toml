[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "repertorio"
version = "0.1.0"
description = "Recomendação de livros, filmes, séries e música com LLMs (Claude e GPT) usando tool use, modelos em PyTorch e evals."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Maria Cecília Torres Vianna" }]
dependencies = [
    "anthropic>=2.0",
    "openai>=2.0",
    "torch>=2.4",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "httpx>=0.27",
    "pydantic>=2.6",
    "pyyaml>=6",
    "python-dotenv>=1",
    "typer>=0.12",
    "rich>=13",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
repertorio = "repertorio.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008"]
